services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: tariffs
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d tariffs"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the two models into the ollama volume (only slow the first time)
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgres://rag:rag@db:5432/tariffs
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3000:3000"
    command: ["sh", "-c", "node ingest.js && node server.js"]
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  pg_data:
  ollama_data:
